name: weldscope-s05

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: weldscope_s05
      MYSQL_USER: weldscope_app
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    ports:
      - "${WELDSCOPE_MYSQL_BIND_IP:-127.0.0.1}:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/s05/01-app-permissions.sql:/docker-entrypoint-initdb.d/01-app-permissions.sql:ro
    secrets:
      - mysql_root_password
      - mysql_app_password
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat /run/secrets/mysql_app_password)" mysql --protocol=TCP -h 127.0.0.1 -u weldscope_app -D weldscope_s05 -sNe "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:

secrets:
  mysql_root_password:
    file: ./.secrets/mysql-root-password
  mysql_app_password:
    file: ./.secrets/mysql-app-password
